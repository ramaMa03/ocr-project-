<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رفع الاستمارة | نظام الإدخال الذكي</title>
<style>
  :root{
    --navy:#2F5D50;
    --teal:#2f93ab;
    --orange:#f0913f;
    --cream:#f7f5f0;
    --ink:#1c2b3a;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family:'Tajawal','Segoe UI',sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ===== Top bar with progress ===== */
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
  }

  .brand{
    font-weight:800;
    font-size:16px;
  }

  .brand span{color:var(--orange);}

  .progress{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
  }

  .progress .dot{
    width:30px; height:30px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:13px;
    border:2px solid rgba(255,255,255,0.25);
    color:#cfe1e7;
  }

  .progress .dot.active{
    background:var(--orange);
    border-color:var(--orange);
    color:#fff;
  }

  .progress .line{
    width:36px; height:2px;
    background:rgba(255,255,255,0.2);
  }

  .progress .dot.done{
    background:var(--teal);
    border-color:var(--teal);
    color:#fff;
  }

  /* ===== Main ===== */
  main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:48px 24px;
  }

  .panel{
    background:#fff;
    border-radius:20px;
    box-shadow:0 18px 50px rgba(21,41,68,0.1);
    padding:42px 38px;
    max-width:640px;
    width:100%;
  }

  .panel h1{
    font-size:24px;
    font-weight:800;
    color:var(--navy);
    margin-bottom:8px;
  }

  .panel .lead{
    color:#6c7a89;
    font-size:14px;
    margin-bottom:30px;
    line-height:1.7;
  }

  /* ===== Drop zone ===== */
  .dropzone{
    border:2px dashed #d8e0e6;
    border-radius:16px;
    background:var(--cream);
    padding:48px 24px;
    text-align:center;
    cursor:pointer;
    transition:border-color .2s ease, background .2s ease;
    position:relative;
  }

  .dropzone.dragover{
    border-color:var(--teal);
    background:#eef7f9;
  }

  .dropzone input{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
  }

  .dropzone .icon{
    width:58px; height:58px;
    margin:0 auto 16px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--teal);
    box-shadow:0 6px 16px rgba(47,147,171,0.18);
  }

  .dropzone h3{
    font-size:16px;
    font-weight:700;
    color:var(--navy);
    margin-bottom:6px;
  }

  .dropzone p{
    font-size:13px;
    color:#9aa8b6;
  }

  .dropzone .formats{
    margin-top:10px;
    font-size:12px;
    color:#c2cdd6;
  }

  /* ===== Preview ===== */
  .preview{
    display:none;
    margin-top:24px;
    border:1px solid #eee;
    border-radius:14px;
    overflow:hidden;
    position:relative;
  }

  .preview.show{display:block;}

  .preview img{
    width:100%;
    max-height:360px;
    object-fit:contain;
    display:block;
    background:#f1f1f1;
  }

  .preview .file-info{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    background:var(--cream);
    font-size:13px;
    color:var(--navy);
  }

  .preview .remove{
    background:none;
    border:none;
    color:var(--orange);
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }

  /* ===== Scan status ===== */
  .scan-status{
    display:none;
    margin-top:24px;
    text-align:center;
    padding:20px;
  }

  .scan-status.show{display:block;}

  .spinner{
    width:38px; height:38px;
    border:4px solid #e6edf1;
    border-top-color:var(--teal);
    border-radius:50%;
    margin:0 auto 14px;
    animation:spin 0.9s linear infinite;
  }

  @keyframes spin{to{transform:rotate(360deg);}}

  .scan-status p{
    color:var(--navy);
    font-size:14px;
    font-weight:600;
  }

  .scan-status .sub{
    color:#9aa8b6;
    font-size:12px;
    margin-top:4px;
    font-weight:400;
  }

  /* ===== Actions ===== */
  .actions{
    display:flex;
    gap:14px;
    margin-top:30px;
    flex-wrap:wrap;
  }

  .btn{
    flex:1;
    border:none;
    border-radius:12px;
    padding:15px 20px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:background .2s ease, transform .2s ease, opacity .2s ease;
    text-decoration:none;
    min-width:160px;
  }

  .btn:focus-visible{outline:3px solid var(--teal); outline-offset:2px;}

  .btn-primary{
    background:var(--orange);
    color:#fff;
    box-shadow:0 8px 20px rgba(240,145,63,0.3);
  }

  .btn-primary:hover{background:#e07f29; transform:translateY(-2px);}

  .btn-primary:disabled{
    opacity:0.45;
    cursor:not-allowed;
    transform:none;
    box-shadow:none;
  }

  .btn-secondary{
    background:#fff;
    color:var(--navy);
    border:1.5px solid #e3e9ed;
  }

  .btn-secondary:hover{background:var(--cream);}

  @media (max-width:520px){
    .panel{padding:28px 20px;}
    .topbar{padding:14px 18px;}
    .actions{flex-direction:column;}
  }

  .social-footer {
    display: flex;
    justify-content: center; /* يخليهم في النص */
    align-items: center;
    gap: 10px; /* مسافة بسيطة بينهم */
    margin-top: 20px;
}
.copy {
    text-align: center;
    margin-top: 15px;
    font-size: 12px;
    color: #555;
}

.social-footer a img {
    width: 38px;   /* الحجم الجديد الصغير */
    height: 38px;
    border-radius: 50%;
  background-color: #F5F1E8; /* بيج نفس خلفية الموقع */


    padding: 6px;  /* أصغر عشان يكون مرتب */
    margin: 0 6px;
    transition: 0.3s;
}

.social-footer a img:hover {
    transform: scale(1.08);
    opacity: 0.9;
}

</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">نظام الإدخال <span>الذكي</span></div>
    <div class="progress">
      <div class="dot done">✓</div>
      <div class="line"></div>
      <div class="dot active">٢</div>
      <div class="line"></div>
      <div class="dot">٣</div>
    </div>
  </div>

  <main>
    <div class="panel">
      <h1>رفع صورة الاستمارة</h1>
      <p class="lead">
        صوّري استمارة المستفيد بإضاءة جيدة وبدون انعكاسات، أو ارفعي صورة محفوظة من الجهاز.
        سيقوم النظام بقراءة البيانات تلقائيًا.
      </p>

      <label class="dropzone" id="dropzone" for="fileInput">
        <input type="file" id="fileInput" accept="image/*" capture="environment">
        <div class="icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <h3>اضغطي لرفع الصورة أو التصوير المباشر</h3>
        <p>اسحبي الملف هنا، أو اضغطي للاختيار من الجهاز</p>
        <div class="formats">JPG · PNG · بحد أقصى 10MB</div>
      </label>

      <div class="preview" id="preview">
        <img id="previewImg" alt="معاينة صورة الاستمارة">
        <div class="file-info">
          <span id="fileName"></span>
          <button class="remove" id="removeBtn">إزالة</button>
        </div>
      </div>

      <div class="scan-status" id="scanStatus">
        <div class="spinner"></div>
        <p>جارٍ قراءة البيانات من الاستمارة...</p>
        <p class="sub">قد تستغرق العملية بضع ثوانٍ</p>
      </div>

      <div class="actions">
<a href="index.html" class="btn btn-secondary">رجوع</a>
        <button class="btn btn-primary" id="scanBtn" disabled>
          مسح الاستمارة
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        

      </div>
    </div>
  </main>

<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const previewImg = document.getElementById('previewImg');
  const fileName = document.getElementById('fileName');
  const removeBtn = document.getElementById('removeBtn');
  const scanBtn = document.getElementById('scanBtn');
  const scanStatus = document.getElementById('scanStatus');

  function handleFile(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      previewImg.src = e.target.result;
      fileName.textContent = file.name;
      preview.classList.add('show');
      scanBtn.disabled = false;
      dropzone.style.display = 'none';
    };
    reader.readAsDataURL(file);
  }

  fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

  ['dragover','dragenter'].forEach(evt =>
    dropzone.addEventListener(evt, e => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    })
  );

  ['dragleave','drop'].forEach(evt =>
    dropzone.addEventListener(evt, e => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
    })
  );

  dropzone.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if(file) handleFile(file);
  });

  removeBtn.addEventListener('click', () => {
    fileInput.value = '';
    preview.classList.remove('show');
    dropzone.style.display = 'block';
    scanBtn.disabled = true;
  });

  scanBtn.addEventListener('click', () => {
    // -----------------------------------------------------------
    // ربط الباك إند: استبدلي هذا الجزء باستدعاء فعلي إلى Flask
    // مثال:
    // const formData = new FormData();
    // formData.append('image', fileInput.files[0]);
    // fetch('/api/scan', { method:'POST', body: formData })
    //   .then(res => res.json())
    //   .then(data => { /* خزني data وانتقلي لصفحة review.html */ });
    // -----------------------------------------------------------

    scanStatus.classList.add('show');
    scanBtn.disabled = true;

    setTimeout(() => {
      window.location.href = 'review.html';
    }, 1800);
  });
</script>

    <!-- الفوتر -->
    <footer>

</div>


    </footer>
</body>
</html>
