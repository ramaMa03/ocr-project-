
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام الإدخال الذكي</title>

<style>

:root{
--navy:#152944;
--orange:#f0913f;
--cream:#f7f5f0;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tajawal,sans-serif;
}

body{
background:var(--cream);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
background:white;
padding:50px;
border-radius:20px;
max-width:700px;
width:90%;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.08);
}

h1{
color:var(--navy);
margin-bottom:20px;
}

p{
line-height:1.8;
color:#666;
margin-bottom:30px;
}

.btn{
display:inline-block;
padding:15px 30px;
background:var(--orange);
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
font-size:16px;
}

.btn:hover{
opacity:.9;
}

</style>

</head>

<body>

<div class="container">

<h1>
نظام الإدخال الذكي للمستفيدين
</h1>

<p>

نظام يعتمد على تقنية OCR والذكاء الاصطناعي
لاستخراج بيانات المستفيدين من الاستمارات
وإدخالها تلقائياً إلى قاعدة البيانات.

</p>

<a href="/upload" class="btn">

بدء الإدخال

</a>

</div>

</body>

</html>
