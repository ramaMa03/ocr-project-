
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayan OCR - نظام الإدخال الذكي</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div id="splash-screen" class="screen active">
        <div class="splash-content">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Bayan OCR" class="splash-logo">
            <div class="loader-bar">
                <div class="loader-progress"></div>
            </div>
        </div>
    </div>

    <div id="dashboard-screen" class="screen">
        
     

        <div class="main-card animate-card">
            <h1 class="dashboard-title">نظام الإدخال الذكي للبيانات</h1>
            <p class="dashboard-desc">
                قم برفع استمارة المستفيد الورقية ليقوم نظام <strong>Bayan OCR</strong> بقراءة واستخراج البيانات تلقائياً وبثوانٍ معدودة وبدقة عالية.
            </p>
        </div>

        <a href="/upload" class="start-btn">ابدأ عملية القراءة والرفع ←</a>
    </div>

   <script>
    // ننتظر 2.5 ثانية (نفس مدة الـ animation)
    setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        const dashboard = document.getElementById('dashboard-screen');
        
        // تلاشي الشاشة الأولى
        splash.style.transition = "opacity 0.5s ease";
        splash.style.opacity = '0';
        
        // إزالتها تماماً من مسار الصفحة
        setTimeout(() => {
            splash.style.display = 'none';
            dashboard.classList.add('active');
        }, 500);
    }, 2500);
</script>
</body>
</html>
