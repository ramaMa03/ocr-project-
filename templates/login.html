<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بيان - تسجيل الدخول</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Tajawal',sans-serif;
    background:#f7f8fa;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    background:#fff;
    width:100%;
    max-width:420px;
    padding:36px 30px;
    border-radius:16px;
    box-shadow:0 8px 25px rgba(0,0,0,.06);
}

/* الشعار */
.logo-row{
    display:flex;
    justify-content:flex-end;
    margin-bottom:30px;
}

.logo-img{
    width:170px;
    height:auto;
}

.title{
    font-size:28px;
    font-weight:800;
    color:#123a5e;
    margin-bottom:8px;
}

.subtitle{
    color:#8a93a3;
    font-size:14px;
    margin-bottom:28px;
}

label{
    display:block;
    font-size:14px;
    font-weight:700;
    margin-bottom:8px;
    color:#1f2937;
}

.field{
    margin-bottom:18px;
}

.input-wrap{
    position:relative;
}

.input-wrap input{
    width:100%;
    padding:13px 44px 13px 14px;
    border:1px solid #e3e6eb;
    border-radius:10px;
    font-family:'Tajawal';
    outline:none;
    font-size:14px;
}

.input-wrap input:focus{
    border-color:#2f8f5b;
}

.icon{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:#9aa3af;
}

.row-between{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:8px 0 25px;
}

.forgot{
    color:#123a5e;
    text-decoration:underline;
    cursor:pointer;
}

.remember{
    display:flex;
    align-items:center;
    gap:8px;
}

.submit-btn{
    width:100%;
    padding:15px;
    border-radius:12px;
    background:linear-gradient(135deg,#3fae72,#1f7a4d);
    color:#fff;
    font-size:16px;
    font-weight:700;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.submit-btn:hover{
    filter:brightness(1.05);
}

</style>

</head>

<body>

<div class="card">

<div class="logo-row">
<img src="{{ url_for('static', filename='images/logo.png') }}" class="logo-img" alt="Bayan OCR">
</div>

<h1 class="title">تسجيل الدخول</h1>

<p class="subtitle">
يجب عليك تسجيل الدخول للوصول إلى بيان
</p>

<div class="field">

<label>اسم المستخدم / رقم الموظف</label>

<div class="input-wrap">

<input type="text" placeholder="ادخل اسم المستخدم">

<span class="icon">

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<circle cx="12" cy="8" r="4"/>
<path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
</svg>

</span>

</div>

</div>

<div class="field">

<label>كلمة المرور</label>

<div class="input-wrap">

<input type="password" placeholder="ادخل كلمة المرور">

<span class="icon">

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<rect x="5" y="11" width="14" height="9" rx="2"/>
<path d="M8 11V7a4 4 0 018 0v4"/>
</svg>

</span>

</div>

</div>

<div class="row-between">

<span class="forgot">نسيت كلمة المرور</span>

<label class="remember">

<input type="checkbox">

تذكرني

</label>

</div>

<a href="/dashboard" class="submit-btn">

تسجيل دخول

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">

<path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/>

<path d="M10 17l5-5-5-5"/>

<path d="M15 12H3"/>

</svg>

</a>

</div>

</body>
</html>
