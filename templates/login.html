
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Bayan OCR</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- =========================
         القسم الأيسر
    ========================== -->

    <div class="left">

        <div class="logo">

            <img
                id="pageLogo"
                src="{{ url_for('static', filename='images/logo.jpg') }}"
                alt="Bayan OCR Logo"
            >

            <h1>Bayan OCR</h1>

            <p>
                Smart Data Entry & Archiving System
            </p>

        </div>

    </div>


    <!-- =========================
         القسم الأيمن - تسجيل الدخول
    ========================== -->

    <div class="right">

        <div class="login-card">

            <!-- زر الوضع الليلي -->

            <button id="dark" type="button">

                <i class="fa-solid fa-moon"></i>

            </button>


            <h2>
                تسجيل الدخول
            </h2>

            <p>
                مرحباً بعودتك 👋
            </p>


            <form action="/dashboard" method="GET">

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        placeholder="اسم المستخدم"
                        required
                    >

                </div>


                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        placeholder="كلمة المرور"
                        required
                    >

                </div>


                <div class="options">

                    <label>

                        <input type="checkbox">

                        تذكرني

                    </label>


                    <a href="#">

                        نسيت كلمة المرور؟

                    </a>

                </div>


                <button
                    class="login-btn"
                    type="submit"
                >

                    تسجيل الدخول

                </button>

            </form>

        </div>

    </div>

</div>


<!-- =========================
     JavaScript
========================== -->

<script src="{{ url_for('static', filename='js/main.js') }}"></script>


<!-- =========================
     تغيير شعار صفحة الدخول
========================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const logo = document.getElementById("pageLogo");

    const darkButton = document.getElementById("dark");

    function updateLoginLogo() {

        if (!logo) return;

        if (document.body.classList.contains("dark")) {

            logo.src = "{{ url_for('static', filename='images/logo-dark.jpg') }}";

        } else {

            logo.src = "{{ url_for('static', filename='images/logo.jpg') }}";

        }

    }


    // عند فتح الصفحة
    updateLoginLogo();


    // عند الضغط على زر الوضع الليلي
    if (darkButton) {

        darkButton.addEventListener("click", function () {

            setTimeout(function () {

                updateLoginLogo();

            }, 0);

        });

    }

});

</script>


</body>

</html>
