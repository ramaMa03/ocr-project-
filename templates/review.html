
<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مراجعة البيانات</title>

<style>

:root{
--navy:#152944;
--orange:#f0913f;
--cream:#f7f5f0;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tajawal,sans-serif;
}

body{
background:var(--cream);
padding:40px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
text-align:center;
color:var(--navy);
margin-bottom:30px;
}

.form-group{
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
color:var(--navy);
}

input,
select,
textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
}

textarea{
height:120px;
resize:none;
}

.actions{
display:flex;
gap:15px;
margin-top:30px;
}

.btn{
flex:1;
padding:15px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.save{
background:var(--orange);
color:white;
}

.back{
background:var(--navy);
color:white;
}

.warning{
background:#fff8e8;
padding:15px;
border-radius:10px;
margin-bottom:25px;
color:#8a6200;
font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<h1>
مراجعة البيانات المستخرجة
</h1>

<div class="warning">

يرجى مراجعة البيانات قبل الحفظ النهائي.

</div>

<form action="/save" method="POST">

<div class="form-group">

<label>الاسم الكامل</label>

<input
type="text"
name="full_name"
value="{{data.full_name}}">

</div>

<div class="form-group">

<label>رقم الهوية</label>

<input
type="text"
name="national_id"
maxlength="10"
value="{{data.national_id}}">

</div>

<div class="form-group">

<label>رقم الجوال</label>

<input
type="text"
name="phone"
value="{{data.phone}}">


</div>

<div class="form-group">

<label>الجنس</label>

<select name="gender">

<option>ذكر</option>

<option>أنثى</option>

</select>

</div>

<div class="form-group">

<label>نوع الخدمة</label>

<select name="service_type">

<option>دعم اجتماعي</option>

<option>استشارة أسرية</option>

<option>برنامج تدريبي</option>

<option>تمكين اقتصادي</option>

<option>أخرى</option>

</select>

</div>

<div class="form-group">

<label>وصف الطلب</label>

<textarea
name="request_description">
</textarea>

</div>

<div class="actions">

<button
type="button"
class="btn back"
onclick="history.back()">

رجوع

</button>

<button
type="submit"
class="btn save">

حفظ البيانات

</button>

</div>

</form>

</div>

</body>

</html>
