
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مراجعة البيانات | Smart Archive AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>

body{
background:#f6f8f5;
font-family:'Tajawal',sans-serif;
}

.review-container{
max-width:900px;
margin:40px auto;
background:white;
padding:40px;
border-radius:30px;
box-shadow:0 15px 35px rgba(0,0,0,.08);
}

.review-title{
text-align:center;
font-size:34px;
font-weight:800;
color:#152944;
margin-bottom:10px;
}

.review-desc{
text-align:center;
color:#666;
margin-bottom:35px;
line-height:2;
}

.form-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.input-group{
display:flex;
flex-direction:column;
}

.input-group label{
margin-bottom:8px;
font-weight:700;
color:#152944;
}

.input-group input,
.input-group textarea{
padding:14px;
border:1px solid #d8e4df;
border-radius:12px;
font-size:15px;
outline:none;
}

.input-group input:focus,
.input-group textarea:focus{
border-color:#11998e;
box-shadow:0 0 0 3px rgba(17,153,142,.15);
}

.full{
grid-column:1 / span 2;
}

textarea{
resize:vertical;
min-height:150px;
}

.buttons{
display:flex;
gap:15px;
margin-top:30px;
}

.save-btn{
flex:1;
background:#11998e;
color:white;
border:none;
padding:18px;
border-radius:15px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.cancel-btn{
flex:1;
background:#ececec;
text-decoration:none;
text-align:center;
padding:18px;
border-radius:15px;
font-weight:bold;
color:#152944;
}

@media(max-width:768px){

.form-grid{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

.buttons{
flex-direction:column;
}

}

</style>

</head>

<body>

<div class="review-container">

<h1 class="review-title">
مراجعة بيانات الأرشفة
</h1>

<p class="review-desc">
راجع البيانات المستخرجة ثم اضغط حفظ لإضافتها إلى سجل الأرشفة.
</p>

<form action="/save" method="POST">

<div class="form-grid">

<div class="input-group">

<label>اسم المستفيد</label>

<input
type="text"
name="full_name"
value="{{ data.full_name }}">

</div>

<div class="input-group">

<label>الجهة</label>

<input
type="text"
name="organization"
value="{{ data.organization }}">

</div>

<div class="input-group">

<label>رقم الخطاب</label>

<input
type="text"
name="letter_number"
value="{{ data.letter_number }}">

</div>

<div class="input-group">

<label>تاريخ الخطاب</label>

<input
type="date"
name="letter_date"
value="{{ data.letter_date }}">

</div>

<div class="input-group full">

<label>وصف الطلب</label>

<textarea
name="request_description">{{ data.request_description }}</textarea>

</div>

</div>

<div class="buttons">

<button
type="submit"
class="save-btn">

💾 حفظ البيانات

</button>

<a
href="/upload"
class="cancel-btn">

↩ العودة

</a>

</div>

</form>

</div>

</body>

</html>
