<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تأكيد البيانات | Bayan OCR</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>

body{
    margin:0;
    background:#f5f7f6;
    font-family:Tajawal,sans-serif;
}

.top-header{
    background:linear-gradient(135deg,#11998e,#38ef7d);
    color:white;
    padding:25px 40px;
}

.header-content{
    display:flex;
    align-items:center;
    gap:20px;
}

.logo{
    width:90px;
    height:90px;
    background:white;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.logo img{
    width:70px;
}

.top-header h1{
    margin:0;
    font-size:36px;
}

.top-header p{
    margin-top:8px;
    font-size:18px;
}

.container{
    width:90%;
    max-width:850px;
    margin:40px auto;
}

.card{
    background:white;
    border-radius:25px;
    padding:40px;
    box-shadow:0 10px 25px rgba(0,0,0,.05);
}

.title{
    text-align:center;
    font-size:32px;
    margin-bottom:10px;
    color:#183153;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:30px;
}

.notice{
    background:#fff8e8;
    border-right:6px solid #f0b429;
    padding:18px;
    border-radius:15px;
    margin-bottom:30px;
}

.notice p{
    margin-top:10px;
    color:#555;
}

.info-box{
    background:#f9fbfa;
    border:1px solid #e5ece8;
    border-radius:15px;
    padding:18px;
    margin-bottom:18px;
}

.info-box label{
    display:block;
    font-weight:bold;
    color:#11998e;
    margin-bottom:8px;
}

.info-box input,
.info-box select,
.info-box textarea{
    width:100%;
    border:none;
    background:transparent;
    font-size:18px;
    color:#333;
    outline:none;
}

.info-box textarea{
    resize:none;
    min-height:90px;
}

.actions{
    display:flex;
    gap:15px;
    margin-top:35px;
}

.btn-save{
    flex:1;
    background:linear-gradient(135deg,#11998e,#27ae60);
    color:white;
    border:none;
    border-radius:15px;
    padding:18px;
    font-size:20px;
    cursor:pointer;
}

.btn-edit{
    flex:1;
    background:#ececec;
    color:#333;
    border:none;
    border-radius:15px;
    padding:18px;
    font-size:20px;
    cursor:pointer;
}

button:hover{
    opacity:.95;
}

</style>

</head>

<body>

<div class="top-header">

<div class="header-content">

<div class="logo">
<img src="{{ url_for('static', filename='images/logo.png') }}">
</div>

<div>
<h1>تأكيد البيانات</h1>
<p>Bayan OCR System</p>
</div>

</div>

</div>

<div class="container">

<div class="card">

<h2 class="title">📋 البيانات المستخرجة</h2>

<p class="subtitle">
تم استخراج البيانات باستخدام تقنية OCR، يرجى مراجعتها قبل الحفظ النهائي.
</p>

<div class="notice">

<strong>💡 تنبيه</strong>

<p>
يمكنك تعديل أي حقل قبل حفظ البيانات داخل النظام.
</p>

</div>

<form action="/save" method="POST">

    <div class="info-box">
        <label>👤 الاسم الكامل</label>
        <input type="text" name="full_name" value="{{ data.full_name }}">
    </div>
    
    <div class="info-box">
        <label>🪪 رقم الهوية</label>
        <input type="text" name="national_id" maxlength="10" value="{{ data.national_id }}">
    </div>
    
    <div class="info-box">
        <label>📱 رقم الجوال</label>
        <input type="text" name="phone" value="{{ data.phone }}">
    </div>
    
    <div class="info-box">
        <label>⚧ الجنس</label>
        <select name="gender">
            <option value="ذكر" {% if data.gender=='ذكر' %}selected{% endif %}>ذكر</option>
            <option value="أنثى" {% if data.gender=='أنثى' %}selected{% endif %}>أنثى</option>
        </select>
    </div>
    
    <div class="info-box">
        <label>🤝 نوع الخدمة</label>
        <select name="service_type">
            <option value="دعم اجتماعي" {% if data.service_type=='دعم اجتماعي' %}selected{% endif %}>دعم اجتماعي</option>
            <option value="استشارة أسرية" {% if data.service_type=='استشارة أسرية' %}selected{% endif %}>استشارة أسرية</option>
            <option value="برنامج تدريبي" {% if data.service_type=='برنامج تدريبي' %}selected{% endif %}>برنامج تدريبي</option>
            <option value="تمكين اقتصادي" {% if data.service_type=='تمكين اقتصادي' %}selected{% endif %}>تمكين اقتصادي</option>
            <option value="أخرى" {% if data.service_type=='أخرى' %}selected{% endif %}>أخرى</option>
        </select>
    </div>
    
    <div class="info-box">
        <label>📝 وصف الطلب</label>
        <textarea name="request_description">{{ data.request_description }}</textarea>
    </div>
    
    <div class="actions">
    
        <button type="button"
                class="btn-edit"
                onclick="history.back()">
    
            ✏️ تعديل البيانات
    
        </button>
    
        <button type="submit"
                class="btn-save">
    
            💾 تأكيد الحفظ
    
        </button>
    
    </div>
    
    </form>
    
    </div>
    
    </div>
    
    </body>
    
    </html>
