
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم الحفظ بنجاح - Bayan OCR</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { 
            background: #f6f8f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        
        .card {
            background: white;
            padding: 50px;
            border-radius: 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.05);
            border: 1px solid rgba(230, 235, 232, 0.8);
        }

        .icon { font-size: 80px; margin-bottom: 20px; }

        h1 { color: var(--primary-green); margin-bottom: 15px; font-size: 28px; }

        p { color: #788880; line-height: 1.8; margin-bottom: 35px; font-size: 16px; }

        .btns { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }

        .btn {
            padding: 15px 25px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
            flex: 1;
        }

        .home { background: #eef2f0; color: var(--navy-dark); }
        .new { background: linear-gradient(135deg, var(--primary-green), var(--accent-green)); color: white; box-shadow: 0 8px 20px rgba(17, 153, 142, 0.2); }

        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
    </style>
</head>

<body>

<div class="card animate-card">
    <div class="icon">✅</div>
    <h1>تم حفظ البيانات بنجاح</h1>
    <p>تمت إضافة بيانات المستفيد إلى النظام بنجاح، وأصبحت الآن متاحة في قاعدة البيانات.</p>

    <div class="btns">
        <a href="/" class="btn home">الرئيسية</a>
        <a href="/upload" class="btn new">إضافة مستفيد جديد</a>
    </div>
</div>

</body>
</html>
