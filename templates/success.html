
<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تم الحفظ بنجاح</title>

<style>

:root{
--navy:#152944;
--orange:#f0913f;
--cream:#f7f5f0;
--green:#27ae60;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tajawal,sans-serif;
}

body{
background:var(--cream);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
padding:50px;
border-radius:20px;
width:90%;
max-width:650px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.icon{
font-size:70px;
margin-bottom:20px;
}

h1{
color:var(--green);
margin-bottom:15px;
}

p{
color:#666;
line-height:1.8;
margin-bottom:30px;
}

.btns{
display:flex;
gap:15px;
justify-content:center;
flex-wrap:wrap;
}

.btn{
padding:14px 25px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

.home{
background:var(--navy);
color:white;
}

.new{
background:var(--orange);
color:white;
}

</style>

</head>

<body>

<div class="card">

<div class="icon">
✅
</div>

<h1>
تم حفظ البيانات بنجاح
</h1>

<p>

تمت إضافة بيانات المستفيد إلى قاعدة البيانات
وأصبحت متاحة داخل النظام.

</p>

<div class="btns">

<a href="/" class="btn home">

الصفحة الرئيسية

</a>

<a href="/upload" class="btn new">

إضافة مستفيد جديد

</a>

</div>

</div>

</body>

</html>
