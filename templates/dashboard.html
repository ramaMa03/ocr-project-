
<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة التحكم</title>

<style>

:root{
--navy:#152944;
--orange:#f0913f;
--cream:#f7f5f0;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tajawal,sans-serif;
}

body{
background:var(--cream);
padding:30px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
flex-wrap:wrap;
gap:15px;
}

h1{
color:var(--navy);
}

.add-btn{
background:var(--orange);
color:white;
padding:12px 20px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h2{
color:var(--navy);
font-size:18px;
margin-bottom:10px;
}

.card p{
font-size:26px;
font-weight:bold;
color:var(--orange);
}

.table-container{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:var(--navy);
color:white;
padding:14px;
}

td{
padding:12px;
border-bottom:1px solid #eee;
text-align:center;
}

tr:hover{
background:#f9f9f9;
}

.home-btn{
display:inline-block;
margin-top:25px;
background:var(--navy);
color:white;
padding:12px 20px;
border-radius:10px;
text-decoration:none;
}

</style>

</head>

<body>

<div class="header">

<h1>لوحة التحكم</h1>

<a href="/upload" class="add-btn">

إضافة مستفيد جديد

</a>

</div>

<div class="stats">

<div class="card">

<h2>إجمالي المستفيدين</h2>

<p>{{ total }}</p>

</div>

<div class="card">

<h2>طلبات اليوم</h2>

<p>{{ today }}</p>

</div>

</div>

<div class="table-container">

<table>

<thead>

<tr>

<th>الاسم</th>

<th>رقم الهوية</th>

<th>رقم الجوال</th>

<th>الجنس</th>

<th>نوع الخدمة</th>

</tr>

</thead>

<tbody>

{% for person in data %}

<tr>

<td>{{ person[1] }}</td>

<td>{{ person[2] }}</td>

<td>{{ person[3] }}</td>

<td>{{ person[4] }}</td>

<td>{{ person[5] }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

<a href="/" class="home-btn">

العودة للرئيسية

</a>

</body>

</html>
