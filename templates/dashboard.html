<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة التحكم | Bayan OCR</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body{
            margin:0;
            background:#f5f7f6;
            font-family:Tahoma,sans-serif;
        }

        .top-header{

            background:linear-gradient(135deg,#11998e,#38ef7d);
            color:white;
            padding:25px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .top-header h1{

            margin:0;
            font-size:38px;

        }

        .top-header p{

            margin:8px 0 0;
            font-size:18px;
            opacity:.9;

        }

        .logo{

            width:90px;
            height:90px;
            background:white;
            border-radius:20px;
            display:flex;
            align-items:center;
            justify-content:center;

        }

        .logo img{

            width:70px;

        }

        .container{

            width:90%;
            margin:auto;
            margin-top:35px;

        }

        .welcome{

            background:linear-gradient(135deg,#11998e,#27ae60);
            color:white;
            border-radius:25px;
            padding:35px;
            margin-bottom:35px;

        }

        .welcome h2{

            margin:0;
            font-size:34px;

        }

        .welcome p{

            margin-top:15px;
            font-size:20px;

        }

        .cards{

            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:25px;

        }

        .card{

            background:white;
            border-radius:25px;
            padding:35px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,.05);
            transition:.3s;

        }

        .card:hover{

            transform:translateY(-8px);

        }

        .green{

            background:linear-gradient(135deg,#11998e,#27ae60);
            color:white;

        }

        .icon{

            font-size:55px;
            margin-bottom:18px;

        }

        .card h3{

            margin:0;
            font-size:30px;

        }

        .card p{

            margin-top:10px;
            color:#888;
            font-size:18px;

        }

        .green p{

            color:white;

        }

        .send{

            margin-top:35px;
            background:white;
            border-radius:25px;
            padding:30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 10px 25px rgba(0,0,0,.05);

        }

        .send button{

            border:none;
            background:#11998e;
            color:white;
            padding:18px 40px;
            border-radius:18px;
            cursor:pointer;
            font-size:20px;

        }

        table{

            width:100%;
            margin-top:40px;
            border-collapse:collapse;
            background:white;
            border-radius:20px;
            overflow:hidden;

        }

        th{

            background:#152944;
            color:white;
            padding:16px;

        }

        td{

            text-align:center;
            padding:16px;
            border-bottom:1px solid #eee;

        }

    </style>

</head>

<body>

    <div class="top-header">

        <div style="display:flex; align-items:center; gap:20px;">
    
            <div class="logo">
                <img src="{{ url_for('static', filename='images/logo.png') }}">
            </div>
    
            <div>
                <h1>لوحة التحكم</h1>
                <p>Bayan OCR System</p>
            </div>
    
        </div>
    
    </div>

<div class="container">

<div class="welcome">

<h2>👋 مرحباً أحمد</h2>

<p>مركز التنمية الاجتماعية - وادي فاطمة</p>

<p>{{ total }} سجل داخل النظام</p>

</div>

<div class="cards">
    <a href="/reports"
    class="card"
    style="text-decoration:none; color:inherit; display:block; cursor:pointer;">
 
     <div class="icon">📋</div>
 
     <h3>السجلات</h3>
 
     <p>{{ total }} سجل</p>
 
 </a>

<div class="card green"
     onclick="window.location.href='/upload'"
     style="cursor:pointer;">

    <div class="icon">➕</div>

    <h3>إضافة استمارة</h3>

    <p style="color:white;">رفع مستفيد جديد</p>

</div>



<div class="card">

<div class="icon">📊</div>

<h3>التقارير</h3>

<p>ملخص البيانات</p>

</div>

</div>

<div class="send">

<div>

<h2>إرسال شهري للوزارة</h2>

<p>{{ total }} سجل جاهز للإرسال</p>

</div>

<button>

🏛 إرسال

</button>

</div>

</div>

</body>

</html>
