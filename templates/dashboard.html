
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Bayan OCR</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* إضافة لمسات خاصة للداشبورد */
        :root {
            --primary-green: #11998e;
            --navy-dark: #152944;
        }
        body { padding: 40px; background: #f6f8f5; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        .add-btn {
            background: linear-gradient(135deg, var(--primary-green), #27ae60);
            color: white;
            padding: 12px 25px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.2);
            transition: 0.3s;
        }
        
        .add-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(17, 153, 142, 0.3); }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        
        .card { background: white; padding: 25px; border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.03); border: 1px solid #f0f0f0; }
        .card h2 { color: #788880; font-size: 14px; margin-bottom: 10px; }
        .card p { font-size: 30px; font-weight: 800; color: var(--primary-green); }

        .table-container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.03); overflow-x: auto; }
        
        th { background: var(--navy-dark); color: white; padding: 15px; }
        td { padding: 15px; border-bottom: 1px solid #f4f4f4; text-align: center; }
        
        .home-btn { display: inline-block; margin-top: 30px; background: #eef2f0; color: var(--navy-dark); padding: 12px 25px; border-radius: 15px; text-decoration: none; font-weight: bold; }
    </style>
</head>

<body>

<div class="header">
    <h1 style="color: var(--navy-dark);">لوحة التحكم</h1>
    <a href="/upload" class="add-btn">+ إضافة مستفيد جديد</a>
</div>

<div class="stats">
    <div class="card">
        <h2>إجمالي المستفيدين</h2>
        <p>{{ total }}</p>
    </div>
    <div class="card">
        <h2>طلبات اليوم</h2>
        <p>{{ today }}</p>
    </div>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>الاسم</th>
                <th>رقم الهوية</th>
                <th>رقم الجوال</th>
                <th>الجنس</th>
                <th>نوع الخدمة</th>
            </tr>
        </thead>
        <tbody>
            {% for person in data %}
            <tr>
                <td>{{ person[1] }}</td>
                <td>{{ person[2] }}</td>
                <td>{{ person[3] }}</td>
                <td>{{ person[4] }}</td>
                <td>{{ person[5] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<a href="/" class="home-btn">← العودة للرئيسية</a>

</body>
</html>
